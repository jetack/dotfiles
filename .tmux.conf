set -g prefix C-q
unbind-key C-b
bind-key C-q send-prefix
set -g allow-passthrough on

# Advertise tmux's native terminfo and truecolor support to modern CLIs.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm*:RGB"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",xterm-256color:Tc"
set -as terminal-overrides ",xterm*:Tc"
set -as terminal-overrides ",*:Tc"
set -as terminal-overrides ",*:bce"
set-environment -gu NO_COLOR
set-environment -g COLORTERM "truecolor"
set-environment -g FORCE_COLOR "3"
set-environment -g CLICOLOR "1"
set-environment -g CLICOLOR_FORCE "1"


set-option -g default-shell /usr/bin/zsh
set-option -g default-command /usr/bin/zsh
